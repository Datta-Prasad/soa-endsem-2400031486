spring.application.name=APIGateway

server.port=1777

spring.cloud.gateway.server.webmvc.routes[0].id=inventory-service
spring.cloud.gateway.server.webmvc.routes[0].uri=http://localhost:1776
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/inventory/**

spring.cloud.gateway.server.webmvc.routes[1].id=shipping-service
spring.cloud.gateway.server.webmvc.routes[1].uri=http://localhost:1780
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/shipping/**

management.endpoints.web.exposure.include=*
management.info.env.enabled=true

info.app.name=API Gateway
info.app.description=API Gateway Project
info.app.author=Datta
info.app.version=1.0